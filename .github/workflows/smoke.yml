name: Smoke

# The Bench workflow runs this first and starts its matrix only when it passes.
on:
  pull_request:
    paths-ignore: [README.md, "results/**"]
  push:
    branches: [main]
    paths-ignore: [README.md, "results/**", pins.json]
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: every-tool
            args: --scenarios accuracy-1000
          - name: network-paths
            args: >-
              --tools graphite-meter --browsers chrome
              --scenarios bufferbloat-300-30,loss-100,compete-100,proxy-1000,multi-200,unshaped
    name: smoke (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Host tools
        run: sudo apt-get install -y --no-install-recommends ethtool
      - name: Run
        env:
          SB_ROOTFUL: "1"
        run: node bench/run.js ${{ matrix.args }} --reps 1 --strict --out "$PWD/results/smoke-${{ matrix.name }}"
      - name: Summary
        if: always()
        run: |
          node bench/summarize.js "results/smoke-${{ matrix.name }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          node bench/phases.js "results/smoke-${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-${{ matrix.name }}
          path: results/smoke-${{ matrix.name }}

  report-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: smoke (report & syntax)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check JS syntax & unit tests
        run: |
          node --check bench/*.js bench/driver/*.js bench/driver/adapters/*.js
          node --test bench/test.js
      - name: Verify report renderer on latest archive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-matplotlib
          python3 -m py_compile bench/charts.py bench/report.py
          latest=$(ls -d results/*-ci-run-* | sort | tail -n 1)
          run_id=${latest##*-ci-run-}
          /usr/bin/python3 bench/report.py "$run_id" --from-archive --rerender
          for f in results/history-trends-dark.png results/history-trends-light.png; do
            test -s "$f"
          done
          for f in chart-throughput-dark chart-throughput-light \
                   chart-accuracy-dark chart-accuracy-light \
                   chart-resources-dark chart-resources-light \
                   chart-transports-dark chart-transports-light \
                   chart-consistency-dark chart-consistency-light; do
            test -s "$latest/$f.png"
          done
