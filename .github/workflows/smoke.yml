name: Smoke

# Every tool, variant and client once, and every scenario once, rootful as in the bench. Any harness error fails it.
# The Bench workflow runs this first and starts its matrix only when it passes.
on:
  pull_request:
    paths-ignore: [README.md, "results/**"]
  push:
    branches: [main]
    paths-ignore: [README.md, "results/**"]
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: every-tool
            args: --scenarios accuracy-1000
          - name: every-scenario
            args: --tools graphite-meter,graphite-meter-client,librespeed,openspeedtest
    name: smoke (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Host tools
        run: sudo apt-get install -y --no-install-recommends ethtool
      - name: Run
        env:
          SB_ROOTFUL: "1"
        run: node bench/run.js ${{ matrix.args }} --reps 1 --strict --out "$PWD/results/smoke-${{ matrix.name }}"
      - name: Summary
        if: always()
        run: node bench/summarize.js "results/smoke-${{ matrix.name }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-${{ matrix.name }}
          path: results/smoke-${{ matrix.name }}
